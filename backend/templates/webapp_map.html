<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ustasi — Jonli Xarita (Mini App)</title>
  <!-- Telegram Web App JS -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body, #map {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .custom-marker {
      background: white;
      border: 2px solid #2563eb;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: transform 0.2s;
    }
    .custom-marker:hover {
      transform: scale(1.15);
    }
    .active-badge {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 10px;
      height: 10px;
      background: #22c55e;
      border-radius: 50%;
      border: 1.5px solid white;
    }
    .leaflet-popup-content-wrapper {
      border-radius: 18px;
      padding: 4px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .leaflet-popup-content {
      margin: 8px 12px;
    }
  </style>
</head>
<body class="bg-slate-100 flex flex-col h-screen overflow-hidden">

  <!-- TOP HEADER & FILTER BAR -->
  <div class="bg-white/95 backdrop-blur-md border-b border-slate-200 z-[1000] px-3 py-2 shadow-sm">
    <div class="flex items-center justify-between mb-2">
      <div class="flex items-center gap-2">
        <span class="text-xl">🛠</span>
        <div>
          <h1 class="text-sm font-black text-slate-800 leading-tight">Ustasi Jonli Xarita</h1>
          <p class="text-[11px] text-slate-500 font-medium" id="stats-counter">Yuklanmoqda...</p>
        </div>
      </div>
      <button onclick="locateMe()" class="flex items-center gap-1 bg-blue-50 text-blue-600 active:bg-blue-100 px-2.5 py-1.5 rounded-xl text-xs font-bold border border-blue-200">
        📍 <span>Mening joyim</span>
      </button>
    </div>

    <!-- CATEGORY FILTER CHIPS -->
    <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1 text-xs">
      <button onclick="filterCategory('all')" id="tab-all" class="cat-btn whitespace-nowrap px-3 py-1 rounded-full font-bold bg-blue-600 text-white shadow-sm">
        Barchasi
      </button>
      <button onclick="filterCategory('Santexnika')" id="tab-santex" class="cat-btn whitespace-nowrap px-3 py-1 rounded-full font-bold bg-slate-100 text-slate-700 hover:bg-slate-200">
        🔧 Santexnika
      </button>
      <button onclick="filterCategory('Elektr va montaj')" id="tab-elektr" class="cat-btn whitespace-nowrap px-3 py-1 rounded-full font-bold bg-slate-100 text-slate-700 hover:bg-slate-200">
        ⚡️ Elektr
      </button>
      <button onclick="filterCategory('Qurilish va ta\'mirlash')" id="tab-qurilish" class="cat-btn whitespace-nowrap px-3 py-1 rounded-full font-bold bg-slate-100 text-slate-700 hover:bg-slate-200">
        🧱 Qurilish
      </button>
      <button onclick="filterCategory('Mebel yig\'ish')" id="tab-mebel" class="cat-btn whitespace-nowrap px-3 py-1 rounded-full font-bold bg-slate-100 text-slate-700 hover:bg-slate-200">
        🛋 Mebel
      </button>
    </div>
  </div>

  <!-- INTERACTIVE MAP CONTAINER -->
  <div id="map" class="flex-1 z-0"></div>

  <!-- SCRIPT DATA & INITIALIZATION -->
  <script>
    // Initialize Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    // Masters injected from Django view
    const mastersData = {{ masters_json|safe }};
    let currentFilter = 'all';
    let markersLayer = L.layerGroup();
    let userMarker = null;

    // Default Tashkent Center
    const map = L.map('map', {
      zoomControl: false
    }).setView([41.2995, 69.2401], 12);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // OpenStreetMap Free Tile Layer
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    markersLayer.addTo(map);

    function getCatIcon(category) {
      if (category.includes('Santex')) return '🔧';
      if (category.includes('Elektr')) return '⚡️';
      if (category.includes('Mebel')) return '🛋';
      return '🧱';
    }

    function renderMarkers() {
      markersLayer.clearLayers();
      let shownCount = 0;

      mastersData.forEach(m => {
        if (currentFilter !== 'all' && !m.category.toLowerCase().includes(currentFilter.toLowerCase())) {
          return;
        }

        shownCount++;
        const iconEmoji = getCatIcon(m.category);
        const iconHtml = `
          <div class="custom-marker" style="width: 36px; height: 36px;">
            <span>${iconEmoji}</span>
            <span class="active-badge"></span>
          </div>
        `;

        const customIcon = L.divIcon({
          html: iconHtml,
          className: '',
          iconSize: [36, 36],
          iconAnchor: [18, 18]
        });

        const popupContent = `
          <div class="w-56 text-slate-800">
            <div class="flex items-center gap-2 mb-2">
              <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center font-bold text-blue-600 text-sm overflow-hidden">
                ${m.avatar_url ? `<img src="${m.avatar_url}" class="w-full h-full object-cover">` : m.full_name[0]}
              </div>
              <div class="flex-1 min-w-0">
                <h4 class="font-bold text-xs text-slate-900 truncate">${m.full_name}</h4>
                <p class="text-[10px] text-blue-600 font-semibold">${m.category}</p>
                <p class="text-[10px] text-slate-500 truncate">📍 ${m.district || m.region}</p>
              </div>
            </div>

            <div class="bg-slate-50 rounded-lg p-2 mb-2 text-[11px] grid grid-cols-2 gap-1 border border-slate-100">
              <div>
                <span class="text-slate-400 block text-[9px]">Reyting</span>
                <span class="font-bold text-amber-500">⭐ ${m.average_rating}</span> (${m.ratings_count})
              </div>
              <div>
                <span class="text-slate-400 block text-[9px]">Narx</span>
                <span class="font-bold text-slate-800">${m.price ? m.price.toLocaleString() : '50,000'} so'm</span>
              </div>
            </div>

            <div class="flex items-center gap-1.5">
              ${m.phone ? `
                <a href="tel:${m.phone}" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-center py-1.5 rounded-lg text-xs font-bold transition">
                  📞 Qo'ng'iroq
                </a>
              ` : ''}
              <button onclick="orderMaster('${m.id}', '${m.full_name}')" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-center py-1.5 rounded-lg text-xs font-bold transition">
                ⚡️ Tanlash
              </button>
            </div>
          </div>
        `;

        const marker = L.marker([m.latitude, m.longitude], { icon: customIcon });
        marker.bindPopup(popupContent);
        markersLayer.addLayer(marker);
      });

      document.getElementById('stats-counter').innerText = `${shownCount} nafar faol usta ko'rsatilmoqda`;
    }

    function filterCategory(cat) {
      currentFilter = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('bg-blue-600', 'text-white');
        btn.classList.add('bg-slate-100', 'text-slate-700');
      });

      let activeId = 'tab-all';
      if (cat.includes('Santex')) activeId = 'tab-santex';
      else if (cat.includes('Elektr')) activeId = 'tab-elektr';
      else if (cat.includes('Qurilish')) activeId = 'tab-qurilish';
      else if (cat.includes('Mebel')) activeId = 'tab-mebel';

      const activeBtn = document.getElementById(activeId);
      if (activeBtn) {
        activeBtn.classList.remove('bg-slate-100', 'text-slate-700');
        activeBtn.classList.add('bg-blue-600', 'text-white');
      }

      renderMarkers();
    }

    function locateMe() {
      if (!navigator.geolocation) {
        alert("Qurilmangiz geolokatsiyani qo'llab-quvvatlamaydi.");
        return;
      }

      navigator.geolocation.getCurrentPosition(pos => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;

        if (userMarker) {
          map.removeLayer(userMarker);
        }

        userMarker = L.circleMarker([lat, lon], {
          radius: 9,
          fillColor: '#3b82f6',
          color: '#ffffff',
          weight: 3,
          opacity: 1,
          fillOpacity: 0.9
        }).addTo(map);

        userMarker.bindPopup("<b>📍 Sizning joylashuvingiz</b>").openPopup();
        map.setView([lat, lon], 14);
      }, err => {
        alert("GPS orqali joylashuvingizni aniqlab bo'lmadi. GPS yoqilganligini tekshiring.");
      });
    }

    function orderMaster(masterId, masterName) {
      if (tg && tg.sendData) {
        tg.sendData(JSON.stringify({ action: 'select_master', master_id: masterId }));
      } else {
        window.location.href = `https://t.me/mftb1817_bot?start=vm_${masterId}`;
      }
    }

    // Initial render
    renderMarkers();
  </script>
</body>
</html>
