databases:
  - name: ustasi-db
    databaseName: ustasi
    user: ustasi_user
    plan: free
    region: frankfurt

services:
  # 1. Django REST Framework Backend Web Service
  - type: web
    name: ustasi-backend
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn ustasi_core.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: ustasi-db
          property: connectionString

  # 2. React / Vite Frontend Static Site
  - type: web
    name: ustasi-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && VITE_API_URL=${BACKEND_URL} npm run build"
    staticPublishPath: "dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: ustasi-backend
          envVarKey: RENDER_EXTERNAL_URL
